<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <title>Anila</title>
    <link rel="icon" href="/assets/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="topbar" id="topbar">
      <form class="search" id="searchForm" role="search">
        <input
          id="searchInput"
          type="search"
          placeholder="Search anime…"
          autocomplete="off"
          spellcheck="false"
        />
      </form>

      <nav class="nav" id="mainNav">
        <a href="#/" data-route="home">Home</a>
        <a href="#/browse" data-route="browse">Browse</a>
        <a href="#/schedule" data-route="schedule">Schedule</a>
        <a href="#/library" data-route="library">Library</a>
      </nav>

      <div class="account" id="account">
        <button class="account-btn" id="accountBtn" title="Account" aria-haspopup="menu" aria-expanded="false">
          <span class="account-avatar" id="accountAvatar">?</span>
        </button>
        <div class="account-menu" id="accountMenu" role="menu" hidden>
          <div class="account-menu-head" id="accountMenuHead"></div>
          <a class="account-menu-item" href="#/profile" data-menu="profile" role="menuitem">Profile</a>
          <a class="account-menu-item" href="#/settings" data-menu="settings" role="menuitem">Settings</a>
          <button class="account-menu-item" id="accountSignin" data-menu="signin" role="menuitem" hidden>Sign in</button>
          <button class="account-menu-item" id="accountSignout" data-menu="signout" role="menuitem" hidden>Sign out</button>
        </div>
      </div>
    </header>

    <main id="view" class="view"></main>

    <div class="toast-wrap" id="toastWrap"></div>
    <div class="modal-root" id="modalRoot"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
