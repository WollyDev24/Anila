<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070b" />
    <title>Anila</title>
    <link rel="icon" href="/assets/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>

    <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="ic-home" viewBox="0 0 24 24">
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5.5 9.2V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.2" />
      </symbol>
      <symbol id="ic-browse" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="m15.6 8.4-2.1 5.1-5.1 2.1 2.1-5.1z" />
      </symbol>
      <symbol id="ic-schedule" viewBox="0 0 24 24">
        <rect x="3" y="4.5" width="18" height="16" rx="3" />
        <path d="M3 9.5h18M8 3v3.5M16 3v3.5" />
      </symbol>
      <symbol id="ic-library" viewBox="0 0 24 24">
        <path d="M6.5 3h11a1 1 0 0 1 1 1v17l-6.5-3.8L5.5 21V4a1 1 0 0 1 1-1z" />
      </symbol>
      <symbol id="ic-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="7" />
        <path d="m20 20-4.2-4.2" />
      </symbol>
      <symbol id="ic-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2" />
        <path
          d="M12 2.6v2.3M12 19.1v2.3M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.6 12h2.3M19.1 12h2.3M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"
        />
      </symbol>
      <symbol id="ic-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4.5 20.2a7.5 7.5 0 0 1 15 0" />
      </symbol>
      <symbol id="ic-logout" viewBox="0 0 24 24">
        <path d="M14.5 4H18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3.5" />
        <path d="M9 12h11M9 12l3.5-3.5M9 12l3.5 3.5" />
      </symbol>
      <symbol id="ic-collapse" viewBox="0 0 24 24">
        <path d="M14.5 7 9.5 12l5 5" />
        <path d="M19 5v14" />
      </symbol>
      <symbol id="ic-download" viewBox="0 0 24 24">
        <path d="M5 19h14" />
        <path d="M12 4v11M12 15l3.5-3.5M12 15l-3.5-3.5" />
      </symbol>

    </svg>

    <div class="app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/" aria-label="Anila home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="30" height="30">
              <defs>
                <linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#a78bfa" />
                  <stop offset="1" stop-color="#7c6cf0" />
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="16" fill="#0b0b12" />
              <path
                d="M32 12 L48 52 H39.5 L36.4 43.5 H27.6 L24.5 52 H16 Z M32 25.5 L29.6 36 H34.4 Z"
                fill="url(#brand-g)"
              />
            </svg>
          </span>
          <span class="brand-name">Anila</span>
        </a>

        <nav class="nav" id="mainNav">
          <a href="#/" data-route="home">
            <svg class="ico"><use href="#ic-home" /></svg><span class="nav-label">Home</span>
          </a>
          <a href="#/browse" data-route="browse">
            <svg class="ico"><use href="#ic-browse" /></svg><span class="nav-label">Browse</span>
          </a>
          <a href="#/schedule" data-route="schedule">
            <svg class="ico"><use href="#ic-schedule" /></svg><span class="nav-label">Schedule</span>
          </a>
          <a href="#/library" data-route="library">
            <svg class="ico"><use href="#ic-library" /></svg><span class="nav-label">Library</span>
          </a>
          <a href="#/downloads" data-route="downloads">
            <svg class="ico"><use href="#ic-download" /></svg><span class="nav-label">Downloads</span>
          </a>
        </nav>

        <div class="sidebar-spacer"></div>

        <button
          class="side-toggle"
          id="sideToggle"
          type="button"
          aria-label="Collapse sidebar"
          aria-expanded="true"
          title="Collapse sidebar"
        >
          <svg class="ico" aria-hidden="true"><use href="#ic-collapse" /></svg>
          <span class="nav-label">Collapse</span>
        </button>

        <div class="account" id="account">
          <button
            class="account-btn"
            id="accountBtn"
            title="Account"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span class="account-avatar" id="accountAvatar">?</span>
            <span class="account-name">Sign in</span>
          </button>
          <div class="account-menu" id="accountMenu" role="menu" hidden>
            <div class="account-menu-head" id="accountMenuHead"></div>
            <a class="account-menu-item" href="#/profile" data-menu="profile" role="menuitem">
              <svg class="ico"><use href="#ic-user" /></svg><span>Profile</span>
            </a>
            <a class="account-menu-item" href="#/settings" data-menu="settings" role="menuitem">
              <svg class="ico"><use href="#ic-settings" /></svg><span>Settings</span>
            </a>
            <button class="account-menu-item" id="accountSignin" data-menu="signin" role="menuitem" hidden>
              <svg class="ico"><use href="#ic-user" /></svg><span>Sign in</span>
            </button>
            <button class="account-menu-item" id="accountSignout" data-menu="signout" role="menuitem" hidden>
              <svg class="ico"><use href="#ic-logout" /></svg><span>Sign out</span>
            </button>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar" id="topbar">
          <form class="search" id="searchForm" role="search">
            <svg class="search-ico" aria-hidden="true"><use href="#ic-search" /></svg>
            <input
              id="searchInput"
              type="search"
              placeholder="Search anime…"
              autocomplete="off"
              spellcheck="false"
            />
          </form>
        </header>

        <main id="view" class="view"></main>
      </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>
    <div class="modal-root" id="modalRoot"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
